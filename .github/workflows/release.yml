name: release
# Tag vX.Y.Z to publish binaries for every platform; run manually for test builds (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  zig: true }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build (zig, static musl)
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          ver=dev; [ "$GITHUB_REF_TYPE" = tag ] && ver=${GITHUB_REF_NAME#v}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=.exe
          mkdir dist
          cp "target/${{ matrix.target }}/release/sxfer$ext" "dist/sxfer-$ver-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: sxfer-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum sxfer-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
