[package]
name = "sxfer"
version = "0.4.0"
edition = "2021"
description = "Move a file or a secret between machines: encrypted, proven receipt, then shred the source."
license = "MIT"
rust-version = "1.80"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
hostname = "0.4"
rpassword = "7"
dirs = "5"
mdns-sd = "0.21.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
